# The kind cluster of the IPv6 workflow's v6 job (.github/workflows/ipv6.yml):
# IPv6 only.
# One node, which also runs the workloads.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv6
nodes:
  - role: control-plane
