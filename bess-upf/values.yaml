# IPv6 and dual-stack, opt-in; see 5g-control-plane's values.yaml. While it is
# empty the chart renders what it renders for an IPv4 cluster. Here it sets
# ipFamilyPolicy and ipFamilies on the Services, and IPv6 in ipFamilies (or as
# preferredFamily) turns on config.upf.ipv6.
global:
  network: {}

images:
  repository: "ghcr.io/omec-project/" # default GitHub Registry
  tags:
    bess: upf-bess:rel-2.6.3
    pfcp: upf-pfcp:rel-2.6.3
    sriov: aether-cni:rel-1.4.1
    tools: pod-init:rel-1.3.1
  pullPolicy: IfNotPresent

nodeSelectors:
  enabled: false
  label: node-role.aetherproject.org/upf
  value: true

resources:
  enabled: true
  bess:
    requests:
      cpu: 2
      memory: 2Gi
    limits:
      cpu: 2
      memory: 2Gi
  routectl:
    requests:
      cpu: 256m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 128Mi
  web:
    requests:
      cpu: 256m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 128Mi
  cpiface:
    requests:
      cpu: 256m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 128Mi

config:
  coreDump:
    enabled: false
    path: /tmp/coredump
  # PFCP raw dump configuration
  upfDump:
    # Enable raw PFCP dump-to-disk for debugging parse errors. When enabled
    # the `pfcp-agent` container will receive environment variables to
    # control where dumps are written and how pruning is performed.
    # Recommended defaults:
    #  - For a single-node/test environment: keep persistence.enabled=false
    #    (uses emptyDir), set maxBytes to limit total storage (default 100MiB)
    #  - For production or long-term capture, enable persistence.enabled=true
    #    and configure a PVC with an appropriate size (size & storageClass).
    enabled: false
    dir: /var/log/upf/pfcp_dumps
    upfName: ""
    maxBytes: 104857600 # 100 MiB
    maxFiles: 1000
    toLog: false
    persistence:
      # When true, the chart will create a PVC for the dump storage
      enabled: false
      size: 5Gi
      storageClass: ""
  gratuitousArp:
    enabled: true
    interval: 10 # seconds
  upf:
    # Enable privileged when run from VM with sriov support
    privileged: false
    prometheus:
      port: 8080
      # Provide nodePort when serviceType is NodePort
      #nodePort: 30088
    hugepage:
      enabled: true
    sriov:
      enabled: true
    # The UPF pod's IPv6 settings. They apply when enabled is true, or, with
    # enabled unset, when global.network has IPv6:
    # - bessd serves gRPC on [::]:10514 (dual-stack) instead of 0.0.0.0:10514,
    #   so the liveness probe reaches it on an IPv6 pod IP;
    # - bess-init drops outgoing ICMPv6 port unreachable, as it does for IPv4;
    # - the CNI tuning plugin, chained after cniPlugin in access-net and
    #   core-net, sets interfaceSysctls on the access and core interfaces
    #   (IFNAME is the interface). The defaults:
    #   - accept_ra 0 keeps a router advertisement on N3 or N6 from adding
    #     addresses or a default route through core, which would take N4 and
    #     DNS off eth0;
    #   - IPv4 forwarding 0 on access and core: BESS forwards in user space,
    #     and with AF_PACKET the pod's kernel sees every frame BESS sees. A
    #     kernel that forwards routes each downlink packet towards the UE
    #     pool. A pod with no cluster IPv4 address, as on an IPv6-only
    #     cluster, has no IPv4 default route through eth0, so that route is
    #     the default through core. The packet goes back out of core, where
    #     BESS picks it up and tunnels it a second time (every packet to the
    #     UE arrives twice, one TTL lower). With a cluster IPv4 address the
    #     copy leaves through eth0 instead and is not duplicated, but it still
    #     leaks into the pod network. Whether the pod's kernel forwards is up
    #     to the CNI (Calico: containerIPForwarding), so it is set here.
    #   Set it to {} to leave the networks as they are (no tuning plugin on the
    #   nodes, say).
    ipv6:
      # enabled: true
      interfaceSysctls:
        net.ipv6.conf.IFNAME.accept_ra: "0"
        net.ipv4.conf.IFNAME.forwarding: "0"
    # Dynamic IP allocation is not supported yet
    # Custom routes inside UPF; IPv6 ones too.
    #routes:
    #  - to: 10.76.28.173/32
    #    via: 169.254.1.1
    ran:
      subnet: 192.168.251.0/24
      # More RAN subnets, of either family; each is routed through the access
      # gateway of its family (gateways.ipv6 for an IPv6 one).
      #subnets:
      #  - 2001:db8:251::/64
    access:
      ipam: static
      cniPlugin: vfioveth
      # Provide sriov resource name when sriov is enabled
      resourceName: "intel.com/intel_sriov_vfio"
      gateway: 192.168.252.1
      ip: 192.168.252.3/24
      # Addresses of either family, used instead of ip; and a gateway per family
      # (gateways.ipv4 defaults to gateway).
      #ips:
      #  - 192.168.252.3/24
      #  - 2001:db8:252::3/64
      #gateways:
      #  ipv4: 192.168.252.1
      #  ipv6: 2001:db8:252::1
      #mac:
      #vlan:
      #iface:
    core:
      ipam: static
      cniPlugin: vfioveth
      # Provide sriov resource name when sriov is enabled
      resourceName: "intel.com/intel_sriov_vfio"
      gateway: 192.168.250.1
      ip: 192.168.250.3/24
      # As for access.
      #ips:
      #  - 192.168.250.3/24
      #  - 2001:db8:250::3/64
      #gateways:
      #  ipv4: 192.168.250.1
      #  ipv6: 2001:db8:250::1
      # Metric of the default route through the core gateway, per family. The
      # IPv4 route is always added, with metric 110 unless set. An IPv6 route is
      # added only when ipv6 is set, through gateways.ipv6. Keep it above the
      # metric of the pod's IPv6 default route on eth0 (usually 1024): a lower
      # one sends N4, DNS and all other pod-network traffic out through core.
      #defaultRouteMetric:
      #  ipv4: 110
      #  ipv6: 2048
      #mac:
      #vlan:
      #iface:
    closedLoop: false
    closedLoopPort: 9301
    cfgFiles:
      upf.jsonc:
        mode: dpdk
        log_level: "info"
        workers: 1
        max_sessions: 50000
        table_sizes:
          pdrLookup: 50000
          flowMeasure: 200000
          appQERLookup: 200000
          sessionQERLookup: 100000
          farLookup: 150000
        # GTP-U addresses: the interface's own (its first IPv4 address and first
        # global IPv6 one, from access.ips/core.ips) unless ipv4/ipv6 name them.
        # transport_family restricts N3 to one family: "ipv4" ignores the IPv6
        # address altogether, "ipv6" offers only IPv6 F-TEIDs (and sends to the
        # IPv6 address of an Outer Header Creation that carries both). Empty, the
        # UPF offers what it has, and the SMF picks the family (upfTransportFamily).
        access:
          ifname: access
          #ipv4: 192.168.252.3
          #ipv6: 2001:db8:252::3
          #transport_family: ""
        core:
          ifname: core
          #ipv6: 2001:db8:250::3
        measure_upf: true
        measure_flow: false
        enable_notify_bess: true
        notify_sockaddr: "/pod-share/notifycp"
        # The SMF asks for End Marker packets on the old N3 tunnel when it switches a
        # session to a new gNB (SNDEM, TS 29.244 8.2.31); the pfcp-agent builds them and
        # bessd sends them, through a socket the two containers must share.
        enable_end_marker: true
        endmarker_sockaddr: "/pod-share/pfcpport"
        cpiface:
          hostname: "upf"
          http_port: "8080"
        # Default global rate limits. Can be changed at runtime via BESS gRPC.
        slice_rate_limit_config:
          # Uplink
          n6_bps: 1000000000 # 1Gbps
          n6_burst_bytes: 12500000 # 10ms * 1Gbps
          # Downlink
          n3_bps: 1000000000 # 1Gbps
          n3_burst_bytes: 12500000 # 10ms * 1Gbps
        qci_qos_config:
          - qci: 0 # Fallback QCI
            cbs: 50000
            ebs: 50000
            pbs: 50000
            burst_duration_ms: 10
            priority: 7

service:
  type: ClusterIP
  #externalIp:
  # Or a list of them, e.g. one per family; added to externalIp.
  #externalIPs: []
  #annotations:

servicemonitor:
  enabled: false
